<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    a { color: #b45309; } a:hover { color: #92400e; }
  </style>
</helmet>
<div style="width: 760px; height: 340px; background: #f4f3ef; padding: 20px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; font-family: 'Segoe UI', system-ui, sans-serif">
  <div style="display: flex; align-items: baseline; gap: 12px">
    <div style="font-size: 18px; font-weight: 700; color: #1a1a1a">배터리</div>
    <div style="font-size: 13px; color: #6b6b6b">잔량 = 남은 한도(비워질수록 소진) · 옆 숫자 = 사용률 · 아래 남은시간</div>
  </div>
  <div style="height: 48px; background: #202020; border-radius: 4px; display: flex; align-items: center; padding-left: 12px; box-sizing: border-box">
    <svg width="190" height="48" viewBox="0 0 190 48" style="display:block; overflow: visible">
<rect x="4" y="9" width="44" height="18" rx="3" fill="none" stroke="#9a9a9a" style="stroke-width: 1.5"></rect>
<rect x="48.5" y="14" width="3" height="8" rx="1" fill="#9a9a9a"></rect>
<rect x="6.5" y="11.5" width="{{f5}}" height="13" rx="1.5" fill="{{c5}}"></rect>
<text x="58" y="22" style="font: 700 11px 'Segoe UI', system-ui, sans-serif; fill: {{c5}}">{{s5}}%</text>
<text x="26" y="41" style="font: 700 9px 'Segoe UI', system-ui, sans-serif; fill: #a0a0a0; text-anchor: middle">2:21/5h</text>
<rect x="100" y="9" width="44" height="18" rx="3" fill="none" stroke="#9a9a9a" style="stroke-width: 1.5"></rect>
<rect x="144.5" y="14" width="3" height="8" rx="1" fill="#9a9a9a"></rect>
<rect x="102.5" y="11.5" width="{{f7}}" height="13" rx="1.5" fill="{{c7}}"></rect>
<text x="154" y="22" style="font: 700 11px 'Segoe UI', system-ui, sans-serif; fill: {{c7}}">{{s7}}%</text>
<text x="122" y="41" style="font: 700 9px 'Segoe UI', system-ui, sans-serif; fill: #a0a0a0; text-anchor: middle">1/7d</text>
</svg>
  </div>
  <div style="font-size: 11px; color: #8a8a8a">↑ 실제 크기(작업표시줄 48px) &nbsp;·&nbsp; ↓ 3배 확대 &nbsp;·&nbsp; 라벨 = 남은시간/창 (5h: H:MM/5h · 7d: N/7d, 24시간 미만 Nh/7d)</div>
  <div style="background: #202020; border-radius: 4px; padding: 8px 14px; align-self: flex-start">
    <svg width="570" height="144" viewBox="0 0 190 48" style="display:block; overflow: visible">
<rect x="4" y="9" width="44" height="18" rx="3" fill="none" stroke="#9a9a9a" style="stroke-width: 1.5"></rect>
<rect x="48.5" y="14" width="3" height="8" rx="1" fill="#9a9a9a"></rect>
<rect x="6.5" y="11.5" width="{{f5}}" height="13" rx="1.5" fill="{{c5}}"></rect>
<text x="58" y="22" style="font: 700 11px 'Segoe UI', system-ui, sans-serif; fill: {{c5}}">{{s5}}%</text>
<text x="26" y="41" style="font: 700 9px 'Segoe UI', system-ui, sans-serif; fill: #a0a0a0; text-anchor: middle">2:21/5h</text>
<rect x="100" y="9" width="44" height="18" rx="3" fill="none" stroke="#9a9a9a" style="stroke-width: 1.5"></rect>
<rect x="144.5" y="14" width="3" height="8" rx="1" fill="#9a9a9a"></rect>
<rect x="102.5" y="11.5" width="{{f7}}" height="13" rx="1.5" fill="{{c7}}"></rect>
<text x="154" y="22" style="font: 700 11px 'Segoe UI', system-ui, sans-serif; fill: {{c7}}">{{s7}}%</text>
<text x="122" y="41" style="font: 700 9px 'Segoe UI', system-ui, sans-serif; fill: #a0a0a0; text-anchor: middle">1/7d</text>
</svg>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"s5h": {"editor": "range", "default": 38, "min": 0, "max": 100, "step": 1, "unit": "%", "section": "사용률"}, "s7d": {"editor": "range", "default": 72, "min": 0, "max": 100, "step": 1, "unit": "%", "section": "사용률"}, "$preview": {"width": 760, "height": 340}}'>
class Component extends DCLogic {
  renderVals() {
    const clamp = v => Math.max(0, Math.min(100, Math.round(v)));
    const s5 = clamp(this.props.s5h ?? 38), s7 = clamp(this.props.s7d ?? 72);
    const col = p => p < 60 ? '#50e678' : p < 85 ? '#ffd700' : '#ff6347';
    return {
      s5, s7, c5: col(s5), c7: col(s7), cd: col(Math.max(s5, s7)),
      b5: 108 * s5 / 100, b7: 108 * s7 / 100,
      carX: 44 + 170 * s5 / 100, truckX: 44 + 162 * s7 / 100,
      f5: 39 * (100 - s5) / 100, f7: 39 * (100 - s7) / 100,
      d5: 87.96 * s5 / 100, d7: 87.96 * s7 / 100
    };
  }
}
</script>
</body>
</html>
